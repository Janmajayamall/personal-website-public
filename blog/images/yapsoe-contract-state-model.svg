<svg width="1800" height="760" viewBox="0 0 1800 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EVM smart contract state comparison</title>
  <desc id="desc">A two-panel diagram comparing the current EVM key-value state model with an encrypted smart contract state split into ciphertext storage and nonce-tag storage.</desc>

  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke-width: 2; }
      .left-panel { stroke: #8fa7b3; }
      .right-panel { stroke: #a79bb8; }
      .left-header { fill: #e7eef1; }
      .right-header { fill: #ece8f1; }
      .subbox { fill: #ffffff; stroke: #c0b8ca; stroke-width: 1.6; }
      .table { fill: #ffffff; stroke: #b8c1c8; stroke-width: 1.5; }
      .grid { stroke: #d2d8dd; stroke-width: 1.1; }
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; fill: #26343c; }
      .section { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; fill: #26343c; }
      .sub { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; fill: #56646d; }
      .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; fill: #56646d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #25323a; }
      .mono-head { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 700; fill: #25323a; }
      .pill-current { fill: #eef4f6; stroke: #b8cbd2; stroke-width: 1.2; }
      .pill-cipher { fill: #eff6ef; stroke: #afc8ae; stroke-width: 1.2; }
      .pill-nonce { fill: #f8f0d9; stroke: #d1bc7e; stroke-width: 1.2; }
      .pill-tag { fill: #f7e9e7; stroke: #d0aaa4; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="760"/>

  <!-- Current State Model -->
  <rect class="panel left-panel" x="52" y="48" width="620" height="664" rx="18"/>
  <path class="left-header" d="M70 48h584a18 18 0 0 1 18 18v62H52V66a18 18 0 0 1 18-18z"/>
  <text class="title" x="362" y="91" text-anchor="middle">Current State Model</text>

  <text class="section" x="362" y="190" text-anchor="middle">Contract Storage</text>
  <text class="sub" x="362" y="228" text-anchor="middle">mapping(bytes32 =&gt; bytes32)</text>

  <rect class="table" x="92" y="302" width="540" height="330" rx="7"/>
  <line class="grid" x1="92" y1="370" x2="632" y2="370"/>
  <line class="grid" x1="92" y1="436" x2="632" y2="436"/>
  <line class="grid" x1="92" y1="502" x2="632" y2="502"/>
  <line class="grid" x1="92" y1="568" x2="632" y2="568"/>
  <line class="grid" x1="362" y1="302" x2="362" y2="632"/>

  <text class="mono-head" x="122" y="344">Key (bytes32)</text>
  <text class="mono-head" x="392" y="344">Value (bytes32)</text>

  <text class="mono" x="122" y="412">0x01...a3f4</text>
  <rect class="pill-current" x="392" y="389" width="170" height="38" rx="5"/>
  <text class="mono" x="477" y="413" text-anchor="middle">0x8f23...c9d1</text>

  <text class="mono" x="122" y="478">0x02...b7c8</text>
  <rect class="pill-current" x="392" y="455" width="170" height="38" rx="5"/>
  <text class="mono" x="477" y="479" text-anchor="middle">0x6a11...7faa</text>

  <text class="mono" x="122" y="544">0x03...de99</text>
  <rect class="pill-current" x="392" y="521" width="170" height="38" rx="5"/>
  <text class="mono" x="477" y="545" text-anchor="middle">0x91bc...6d20</text>

  <text class="mono" x="122" y="610">...</text>
  <text class="mono" x="477" y="610" text-anchor="middle">...</text>

  <!-- Encrypted Smart Contract State -->
  <rect class="panel right-panel" x="732" y="48" width="1016" height="664" rx="18"/>
  <path class="right-header" d="M750 48h980a18 18 0 0 1 18 18v62H732V66a18 18 0 0 1 18-18z"/>
  <text class="title" x="1240" y="91" text-anchor="middle">Encrypted Smart Contract State</text>

  <!-- EncryptedStateContract -->
  <rect class="subbox" x="772" y="154" width="462" height="512" rx="16"/>
  <text class="section" x="1003" y="203" text-anchor="middle">EncryptedStateContract</text>
  <text class="sub" x="1003" y="238" text-anchor="middle">Stores AES-GCM ciphertext</text>

  <text class="section" x="1003" y="316" text-anchor="middle">Ciphertext Store</text>
  <text class="small" x="1003" y="348" text-anchor="middle">mapping(bytes32 =&gt; bytes32)</text>

  <rect class="table" x="806" y="388" width="394" height="248" rx="7"/>
  <line class="grid" x1="806" y1="448" x2="1200" y2="448"/>
  <line class="grid" x1="806" y1="496" x2="1200" y2="496"/>
  <line class="grid" x1="806" y1="544" x2="1200" y2="544"/>
  <line class="grid" x1="806" y1="592" x2="1200" y2="592"/>
  <line class="grid" x1="1003" y1="388" x2="1003" y2="636"/>

  <text class="mono-head" x="830" y="424">Key (bytes32)</text>
  <text class="mono-head" x="1027" y="424">Ciphertext (bytes32)</text>

  <text class="mono" x="830" y="480">0x01...a3f4</text>
  <rect class="pill-cipher" x="1042" y="459" width="130" height="32" rx="5"/>
  <text class="mono" x="1107" y="480" text-anchor="middle">3a7f...c91d</text>

  <text class="mono" x="830" y="528">0x02...b7c8</text>
  <rect class="pill-cipher" x="1042" y="507" width="130" height="32" rx="5"/>
  <text class="mono" x="1107" y="528" text-anchor="middle">8f2e...77aa</text>

  <text class="mono" x="830" y="576">0x03...de99</text>
  <rect class="pill-cipher" x="1042" y="555" width="130" height="32" rx="5"/>
  <text class="mono" x="1107" y="576" text-anchor="middle">e1b4...6d20</text>

  <text class="mono" x="830" y="624">...</text>
  <text class="mono" x="1107" y="624" text-anchor="middle">...</text>

  <!-- NonceTagContract -->
  <rect class="subbox" x="1268" y="154" width="440" height="512" rx="16"/>
  <text class="section" x="1488" y="203" text-anchor="middle">NonceTagContract</text>
  <text class="sub" x="1488" y="238" text-anchor="middle">Stores Nonce + Tag</text>
  <text class="small" x="1488" y="270" text-anchor="middle">Owned by EncryptedStateContract</text>

  <text class="section" x="1488" y="316" text-anchor="middle">Nonce + Tag Store</text>
  <text class="small" x="1488" y="348" text-anchor="middle">mapping(bytes32 =&gt; bytes32)</text>

  <rect class="table" x="1300" y="388" width="376" height="248" rx="7"/>
  <line class="grid" x1="1300" y1="448" x2="1676" y2="448"/>
  <line class="grid" x1="1300" y1="496" x2="1676" y2="496"/>
  <line class="grid" x1="1300" y1="544" x2="1676" y2="544"/>
  <line class="grid" x1="1300" y1="592" x2="1676" y2="592"/>
  <line class="grid" x1="1444" y1="388" x2="1444" y2="636"/>
  <line class="grid" x1="1560" y1="388" x2="1560" y2="636"/>

  <text class="mono-head" x="1320" y="424">Key (bytes32)</text>
  <text class="mono-head" x="1470" y="424">Nonce (12B)</text>
  <text class="mono-head" x="1586" y="424">Tag (16B)</text>

  <text class="mono" x="1320" y="480">0x01...a3f4</text>
  <rect class="pill-nonce" x="1464" y="459" width="76" height="32" rx="5"/>
  <text class="small" x="1502" y="480" text-anchor="middle">Nonce</text>
  <rect class="pill-tag" x="1588" y="459" width="64" height="32" rx="5"/>
  <text class="small" x="1620" y="480" text-anchor="middle">Tag</text>

  <text class="mono" x="1320" y="528">0x02...b7c8</text>
  <rect class="pill-nonce" x="1464" y="507" width="76" height="32" rx="5"/>
  <text class="small" x="1502" y="528" text-anchor="middle">Nonce</text>
  <rect class="pill-tag" x="1588" y="507" width="64" height="32" rx="5"/>
  <text class="small" x="1620" y="528" text-anchor="middle">Tag</text>

  <text class="mono" x="1320" y="576">0x03...de99</text>
  <rect class="pill-nonce" x="1464" y="555" width="76" height="32" rx="5"/>
  <text class="small" x="1502" y="576" text-anchor="middle">Nonce</text>
  <rect class="pill-tag" x="1588" y="555" width="64" height="32" rx="5"/>
  <text class="small" x="1620" y="576" text-anchor="middle">Tag</text>

  <text class="mono" x="1320" y="624">...</text>
  <text class="mono" x="1502" y="624" text-anchor="middle">...</text>
  <text class="mono" x="1620" y="624" text-anchor="middle">...</text>
</svg>
